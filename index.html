
<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171b18">
  <meta name="description" content="Yayas Arkiv — ett personligt fotografiskt arkiv.">
  <title>Yayas Arkiv</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="#top">Yayas Arkiv</a>

    <nav aria-label="Huvudmeny">
      <a href="#portratt">Porträtt</a>
      <a href="#stad">Stad</a>
      <a href="#kvallar">Kvällar</a>
      <a href="#resor">Resor</a>
      <a href="#ovrigt">Övrigt</a>
    </nav>

    <a class="about-link" href="#om">Om</a>
  </header>

  <main id="top">
    <section class="hero">
      <div class="hero-image" role="img"
        aria-label="Stämningsfullt porträtt i kvällsljus"></div>
      <div class="hero-copy">
        <h1>Yayas Arkiv</h1>
      </div>
      <a class="scroll-note" href="#portratt">Scrolla ner ↓</a>
    </section>

    <section id="portratt" class="chapter chapter-portratt">
      <div class="chapter-heading">
        <h2>Porträtt</h2>
      </div>
      <div class="gallery">
        <div class="photo p1 tall" role="img" aria-label="Porträtt"></div>
        <div class="photo p2 medium" role="img" aria-label="Person i kvällsljus"></div>
        <div class="photo p3 short" role="img" aria-label="Intimt ögonblick"></div>
        <div class="photo p4 tall" role="img" aria-label="Person vid ett fönster"></div>
        <div class="photo p5 medium" role="img" aria-label="Vardagsporträtt"></div>
        <div class="photo p6 short" role="img" aria-label="Möte mellan människor"></div>
      </div>
    </section>

    <section id="stad" class="chapter chapter-stad">
      <div class="chapter-heading">
        <h2>Stad</h2>
      </div>
      <div class="gallery">
        <div class="photo c1 tall" role="img" aria-label="Regnig stadsgata"></div>
        <div class="photo c2 medium" role="img" aria-label="Stad i skymning"></div>
        <div class="photo c3 tall" role="img" aria-label="Byggnader i kvällsljus"></div>
        <div class="photo c4 short" role="img" aria-label="Kollektivtrafik i rörelse"></div>
        <div class="photo c5 medium" role="img" aria-label="Gata med gatlyktor"></div>
      </div>
    </section>

    <section id="kvallar" class="chapter chapter-kvallar">
      <div class="chapter-heading">
        <h2>Kvällar</h2>
      </div>
      <div class="gallery">
        <div class="photo n1 medium" role="img" aria-label="Vänner under en kväll"></div>
        <div class="photo n2 tall" role="img" aria-label="Människa i nattljus"></div>
        <div class="photo n3 short" role="img" aria-label="Detaljer från ett bord"></div>
        <div class="photo n4 tall" role="img" aria-label="Porträtt på fest"></div>
        <div class="photo n5 medium" role="img" aria-label="Ljussken i mörker"></div>
      </div>
    </section>

    <section id="resor" class="chapter chapter-resor">
      <div class="chapter-heading">
        <h2>Resor</h2>
      </div>
      <div class="gallery">
        <div class="photo r1 tall" role="img" aria-label="Landskap vid kusten"></div>
        <div class="photo r2 medium" role="img" aria-label="Utsikt från ett fönster"></div>
        <div class="photo r3 tall" role="img" aria-label="Gata i en annan stad"></div>
        <div class="photo r4 short" role="img" aria-label="Vatten och berg"></div>
        <div class="photo r5 medium" role="img" aria-label="Resa i kvällsljus"></div>
      </div>
    </section>

    <section id="ovrigt" class="chapter chapter-ovrigt">
      <div class="chapter-heading">
        <h2>Övrigt</h2>
      </div>
      <div class="gallery">
        <div class="photo o1 medium" role="img" aria-label="Skuggor på en vägg"></div>
        <div class="photo o2 tall" role="img" aria-label="Detalj av ett rum"></div>
        <div class="photo o3 short" role="img" aria-label="Kamera och fotografiska detaljer"></div>
        <div class="photo o4 medium" role="img" aria-label="Ljus över vatten"></div>
        <div class="photo o5 tall" role="img" aria-label="Ljus och texturer"></div>
      </div>
    </section>

    <section id="om" class="about">
      <h2>Om arkivet</h2>
      <p>Ett pågående arkiv av fotografier.</p>
    </section>
  </main>

  <footer>
    <a class="logo" href="#top">Yayas Arkiv</a>
    <a href="#top">Till toppen ↑</a>
  </footer>
  
<script>
  const photos = document.querySelectorAll('.gallery .photo');

  if ('IntersectionObserver' in window) {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target);
        }
      });
    }, {
      threshold: 0.12,
      rootMargin: '0px 0px -40px 0px'
    });

    photos.forEach((photo, index) => {
      photo.style.transitionDelay = `${(index % 3) * 100}ms`;
      observer.observe(photo);
    });
  } else {
    photos.forEach((photo) => {
      photo.classList.add('is-visible');
    });
  }
</script>
</body>
</html>

</body>
</html>
